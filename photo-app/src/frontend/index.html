<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Photo App</h1>
        </header>
        
        <main>
            <section class="upload-section">
                <h2>Upload a Photo</h2>
                <form id="upload-form">
                    <div class="form-group">
                        <label for="photo-file">Select a photo:</label>
                        <input type="file" id="photo-file" accept="image/*" required>
                    </div>
                    <button type="submit" id="upload-button">Upload</button>
                </form>
                <div id="upload-status" class="status"></div>
            </section>
            
            <section class="photos-section">
                <h2>Your Photos</h2>
                <div id="photo-list">
                    <p id="no-photos-message">No photos found. Upload some photos to see them here.</p>
                </div>
            </section>
            
            <section class="photo-details-section" id="photo-details" style="display: none;">
                <h2>Photo Details</h2>
                <div class="photo-container">
                    <img id="photo-display" src="" alt="Selected photo">
                </div>
                <div class="details-container">
                    <p><strong>File Name:</strong> <span id="photo-filename"></span></p>
                    <p><strong>Upload Date:</strong> <span id="photo-date"></span></p>
                    <p><strong>Photo ID:</strong> <span id="photo-id"></span></p>
                    <button id="download-button">Download Photo</button>
                </div>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2023 Photo App - Serverless Application</p>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
